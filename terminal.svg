<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1 }
        50%       { opacity: 0 }
      }
      @keyframes fadein {
        from { opacity: 0 }
        to   { opacity: 1 }
      }
      .cursor1 {
        animation:
          blink 0.7s step-end 0.4s 3,
          fadein 0s 2.5s reverse both;
        fill: #eeeeec;
      }
      .line-hi      { animation: fadein 0.25s ease 2.6s both; }
      .line-edu1    { animation: fadein 0.25s ease 2.85s both; }
      .line-edu2    { animation: fadein 0.25s ease 2.85s both; }
      .head-ri      { animation: fadein 0.25s ease 3.15s both; }
      .line-b1      { animation: fadein 0.2s ease 3.4s both; }
      .line-b2      { animation: fadein 0.2s ease 3.6s both; }
      .line-b3      { animation: fadein 0.2s ease 3.8s both; }
      .line-b4      { animation: fadein 0.2s ease 4.0s both; }
      .line-prompt2 { animation: fadein 0.2s ease 4.3s both; }
      .cursor2 {
        animation:
          fadein 0s 4.3s both,
          blink 1s step-end 4.3s infinite;
        fill: #eeeeec;
      }
    </style>

    <!--
      Prompt "hridoy@github:~$ " = 17 chars * 8.4px = 142.8px
      Command starts at x = 18 + 142.8 = 160.8 => use 161
      Command "cat about.txt" = 13 chars * 8.4px = 109.2px wide
      Clip rect sits in absolute SVG coords starting at x=161
    -->
    <clipPath id="cmd-clip">
      <rect x="161" y="46" width="0" height="20">
        <animate
          attributeName="width"
          from="0" to="110"
          dur="1.95s"
          begin="0.4s"
          fill="freeze"
          calcMode="discrete"
          keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
          values="0;8;17;26;34;43;51;60;68;77;85;94;102;110"/>
      </rect>
    </clipPath>
  </defs>

  <!-- terminal background -->
  <rect width="860" height="300" rx="10" fill="#1e1e1e"/>

  <!-- title bar -->
  <rect width="860" height="34" rx="10" fill="#3c1224"/>
  <rect y="20" width="860" height="14" fill="#3c1224"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" font-family="'Courier New',monospace" font-size="13" fill="#d9c8d4" text-anchor="middle">hridoy@github: ~</text>

  <!-- Phase 1: static prompt -->
  <text y="62" font-family="'Courier New',monospace" font-size="14">
    <tspan x="18" fill="#4e9a06">hridoy@github</tspan><tspan fill="#eeeeec">:</tspan><tspan fill="#3465a4">~</tspan><tspan fill="#eeeeec">$ </tspan>
  </text>

  <!-- typed command — clipped to reveal left→right -->
  <text clip-path="url(#cmd-clip)" x="161" y="62" font-family="'Courier New',monospace" font-size="14" fill="#eeeeec">cat about.txt</text>

  <!-- blinking cursor, moves with each typed character then hides -->
  <rect class="cursor1" y="49" width="8.4" height="14">
    <animate
      attributeName="x"
      from="161" to="271"
      dur="1.95s"
      begin="0.4s"
      fill="freeze"
      calcMode="discrete"
      keyTimes="0;0.077;0.154;0.231;0.308;0.385;0.462;0.538;0.615;0.692;0.769;0.846;0.923;1"
      values="161;169.4;177.8;186.2;194.6;203;211.4;219.8;228.2;236.6;245;253.4;261.8;270.2"/>
  </rect>

  <!-- Phase 2 output -->
  <text class="line-hi" x="18" y="88" font-family="'Courier New',monospace" font-size="14" fill="#fce94f">&#x1F44B; Hi, I'm Hridoy</text>

  <text class="line-edu1" x="18" y="108" font-family="'Courier New',monospace" font-size="13.5" fill="#eeeeec">&#x1F393; Nuclear Engineering student at the University of Dhaka,</text>
  <text class="line-edu2" x="18" y="126" font-family="'Courier New',monospace" font-size="13.5" fill="#eeeeec">   currently completing the 7th semester of the B.Sc. program.</text>

  <text class="head-ri" x="18" y="154" font-family="'Courier New',monospace" font-size="14" fill="#8ae234" font-weight="bold">## Research Interests</text>

  <text class="line-b1" x="18" y="176" font-family="'Courier New',monospace" font-size="14">
    <tspan fill="#729fcf">* </tspan><tspan fill="#eeeeec">Fusion Energy and Plasma Physics</tspan>
  </text>
  <text class="line-b2" x="18" y="196" font-family="'Courier New',monospace" font-size="14">
    <tspan fill="#729fcf">* </tspan><tspan fill="#eeeeec">Reactor Physics and Reactor Kinetics</tspan>
  </text>
  <text class="line-b3" x="18" y="216" font-family="'Courier New',monospace" font-size="14">
    <tspan fill="#729fcf">* </tspan><tspan fill="#eeeeec">Scientific Computing</tspan>
  </text>
  <text class="line-b4" x="18" y="236" font-family="'Courier New',monospace" font-size="14">
    <tspan fill="#729fcf">* </tspan><tspan fill="#eeeeec">Scientific Machine Learning (SciML)</tspan>
  </text>

  <!-- trailing prompt -->
  <text class="line-prompt2" y="264" font-family="'Courier New',monospace" font-size="14">
    <tspan x="18" fill="#4e9a06">hridoy@github</tspan><tspan fill="#eeeeec">:</tspan><tspan fill="#3465a4">~</tspan><tspan fill="#eeeeec">$ </tspan>
  </text>
  <rect class="cursor2" x="161" y="251" width="8.4" height="14"/>
</svg>
